[project]
name = "hiddenarena"
version = "0.1.0"
description = "A blind, head-to-head benchmark of coding harnesses, built on harness-interface."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "harness-interface",
    "httpx>=0.27",
    "pytest>=8",                                     # the smoke benchmark's hidden tests
]

[project.scripts]
hiddenarena = "hiddenarena.cli:main"

[tool.uv.sources]
harness-interface = { git = "https://github.com/mrcloudchase/harness-interface", tag = "v1.0.2" }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hiddenarena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
